---
- name: 设置系统时区（Asia/Shanghai）
  timedatectl:
    name: "Asia/Shanghai"
    state: present
    enabled: yes

- name: Remove ntp package
  yum:
    name: 
      - ntp
    state: absent
  when: (ansible_distribution in ["OpenEuler", "CentOS"])

- name: Install chrony package
  yum:
    name: chrony
    state: present
  when: (ansible_distribution in ["OpenEuler", "CentOS"])

- name: Remove ntp package
  apt:
    name:
      - ntp
    state: absent
  when: ansible_distribution == "Ubuntu"

- name: Install chrony package
  apt:
    name: chrony
    state: present
  when: ansible_distribution == "Ubuntu"

- name: Configure chronyd service
  template:
    src: chrony.j2
    dest: /etc/chrony.conf

- name: Restart chronyd.service
  systemd:
    name: chronyd.service
    state: restarted
    enabled: yes

- name: 等待 Chrony 完成首次同步（最多等待30秒）
  command: chronyc tracking
  retries: 6  # 重试6次（每次间隔5秒）
  delay: 5
  until: "'Leap status : Normal' in chrony_tracking.stdout"
  ignore_errors: yes