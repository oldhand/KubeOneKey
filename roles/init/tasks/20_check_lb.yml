---
- name: "计算主节点数量"
  set_fact:
    master_node_count: "{{ (groups['k8s'] | map('extract', hostvars, 'is_master') | map('int') | select('equalto', 1) | list | length) }}"
  run_once: true

- name: "显示主节点数量"
  ansible.builtin.debug:
    msg:
      - "当前模式为高可用模式，需配置负载均衡器"
      - "主节点数量: {{ master_node_count }}"
  run_once: true

- name: 校验主节点数量为奇数且在允许范围内
  ansible.builtin.fail:
    msg:
      - "错误：K8s 主节点数量必须为奇数（1/3/5）！"
      - "当前检测到的主节点数量：{{ master_node_count }}"
      - "请检查 hosts 文件中 is_master 变量的配置，确保主节点数量为奇数。"
  run_once: true
  when: (master_node_count | int) % 2 == 0

