---
- name: 创建临时目录存放镜像
  file:
    path: "/tmp/images/hami"
    state: directory
    mode: '0755'

- name: 创建目录存放 hami 镜像
  file:
    path: "{{ playbook_dir }}/hami/{{ ansible_architecture }}"
    state: directory
    mode: '0755'

- name: 设置依赖的镜像
  ansible.builtin.set_fact:
    hami_images:
      - "projecthami/hami:{{ hami_version }}"
      - "jettech/kube-webhook-certgen:v1.5.2"
      - "liangjw/kube-webhook-certgen:v1.1.1"

- name: 检查 projecthami_hami_v2.6.1.tar 是否存在
  stat:
    path: "{{ playbook_dir }}/hami/{{ ansible_architecture }}/projecthami_hami_v2.6.1.tar"
  register: projecthami_hami_tar_stat
  run_once: true

- name: 检查 hami.zip.001 是否存在
  stat:
    path: "{{ playbook_dir }}/hami/{{ ansible_architecture }}/hami.zip.001"
  register: hami_zip_stat
  run_once: true


- name: 合并分卷并解压生成 nvidia-device-plugin-v0.17.4.tar
  shell: |
    # 合并分卷为完整zip文件
    cat {{ playbook_dir }}/hami/{{ ansible_architecture }}/hami.zip.001 \
        {{ playbook_dir }}/hami/{{ ansible_architecture }}/hami.zip.002 \ 
        > {{ playbook_dir }}/hami/{{ ansible_architecture }}/hami.zip
    
    # 解压zip到目标目录（确保tar直接生成在该目录）
    unzip -q -o {{ playbook_dir }}/hami/{{ ansible_architecture }}/hami.zip \
          -d {{ playbook_dir }}/hami/{{ ansible_architecture }}/
    
    # 清理临时zip文件
    rm -f {{ playbook_dir }}/hami/{{ ansible_architecture }}/hami.zip
  run_once: true  # 控制节点执行一次
  when:
    - not projecthami_hami_tar_stat.stat.exists  # projecthami_hami_v2.6.1.tar 不存在时执行
    - hami_zip_stat.stat.exists  # hami.zip.001 存在时执行

- name: 处理 hami 镜像（检查本地文件 -> 拉取 -> 保存）
  block:
    - name: 检查本地是否存在镜像文件
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/hami/{{ ansible_architecture }}/{{ item | replace('/', '_') | replace(':', '_') }}.tar"
      register: image_file_stat
      loop: "{{ hami_images }}"
      run_once: true

    - name: 拉取远程镜像
      ansible.builtin.command: "docker pull {{ base_repo }}/{{ item }}"
      register: pull_result
      changed_when: "'Status: Downloaded newer image for' in pull_result.stdout"
      when: not (image_file_stat.results | selectattr('item', 'equalto', item) | first).stat.exists
      loop: "{{ hami_images }}"
      run_once: true


    - name: 将镜像保存到本地目录
      ansible.builtin.command: >
        docker save {{ base_repo }}/{{ item }}
        -o {{ playbook_dir }}/hami/{{ ansible_architecture }}/{{ item | replace('/', '_') | replace(':', '_') }}.tar
      changed_when: true
      when:
        - not (image_file_stat.results | selectattr('item', 'equalto', item) | first).stat.exists
        - (pull_result.results | selectattr('item', 'equalto', item) | first) is succeeded
      loop: "{{ hami_images }}"
      run_once: true

  when: hami_images is defined and hami_images | length > 0
  run_once: true


- name: 查找所有属于 hami 的镜像（tar）文件
  ansible.builtin.find:
    path: "{{ playbook_dir }}/hami/{{ ansible_architecture }}/"
    patterns: '*.tar'
    recurse: no
  delegate_to: localhost
  register: tar_files
  run_once: true


- name: 复制 hami 的镜像文件到目标节点
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/hami/{{ ansible_architecture }}/{{ item | basename }}"
    dest: "/tmp/images/hami/{{ item | basename }}"
    mode: '0644'
  with_items: "{{ tar_files.files | map(attribute='path') | list }}"
  when: tar_files.files | length > 0


- name: 加载 hami 的镜像文件到 Docker
  shell: "docker load -i /tmp/images/hami/{{ item | basename }}"
  with_items: "{{ tar_files.files | map(attribute='path') | list }}"
  when: tar_files.files | length > 0


