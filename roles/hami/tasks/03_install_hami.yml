---
- name: Create remote temporary directory
  file:
    path: "/tmp/hami_offline_install"
    state: directory
    mode: '0755'
  run_once: true

- name: Transfer Hami Helm Chart to remote node
  copy:
    src: "files/hami-{{ hami_version | replace('v', '') }}.tgz"
    dest: "/tmp/hami_offline_install/hami-{{ hami_version | replace('v', '') }}.tgz"
    mode: '0644'
  run_once: true

- name: Transfer hami.yaml to remote node
  copy:
    src: "files/hami.yaml"
    dest: "/tmp/hami_offline_install/hami.yaml"
    mode: '0644'
  run_once: true

- name: Uninstall Hami using Helm
  command: >
    /usr/local/bin/helm uninstall hami --namespace kube-system
  register: uninstall_hami
  changed_when: "'uninstalled' in uninstall_hami.stdout"
  failed_when:
    - uninstall_hami.rc != 0
    - "'not found' not in uninstall_hami.stderr"
  run_once: true


- name: Install Hami from local Helm Chart
  command: >
    /usr/local/bin/helm upgrade --install hami /tmp/hami_offline_install/hami-{{ hami_version | replace('v', '') }}.tgz \
    --namespace kube-system \
    --create-namespace \
    -f /tmp/hami_offline_install/hami.yaml
  register: install_hami
  changed_when: "'installed' in install_hami.stdout"
  failed_when:
    - install_hami.rc != 0
    - "'already exists' not in install_hami.stderr"
  run_once: true

- name: "检查 hami-device-plugin Pod 是否存在"
  command: >
    kubectl get pods -n kube-system -l app.kubernetes.io/component=hami-device-plugin --no-headers
  register: hami_pod_check
  when: install_hami.rc == 0
  run_once: true
  failed_when: false

# 步骤2：仅当Pod存在时，等待其进入Running状态
- name: "等待 hami-device-plugin 节点就绪状态（仅Pod存在时执行）"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: kube-system
    label_selectors: ["app.kubernetes.io/component=hami-device-plugin"]  # 与步骤1标签一致
    field_selectors: ["status.phase=Running"]  # 筛选运行中状态
  register: hami_status
  until: hami_status.resources | length > 0
  retries: 30
  delay: 10
  when:
    - install_hami.rc == 0
    - hami_pod_check.stdout | length > 0  # 仅Pod存在时执行
  run_once: true


- name: Clean up temporary files
  file:
    path: "/tmp/hami_offline_install/"
    state: absent
  when: "'cleanup' not in ansible_run_tags"
  run_once: true